<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>打工人 MBTI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --bg:#fff6e5; --ink:#1a1a1a; --card:#ffffff; --muted:#6b6257;
    --nt:#c3b1ff; --nf:#8fe3b3; --sj:#9fd0ff; --sp:#ffd36e; --pk:#ffb3c7;
    --accent:#ff6b4a; --shadow:4px 4px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh;
    background-image:radial-gradient(#e9dcc3 1.2px,transparent 1.2px);
    background-size:18px 18px;
  }
  #app{max-width:520px;margin:0 auto;padding:24px 16px 48px}
  .screen{display:none}
  .screen.active{display:block;animation:up .35s ease}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .box{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:var(--shadow)}
  .btn{
    display:block;width:100%;font:inherit;font-size:17px;font-weight:800;cursor:pointer;
    padding:15px 18px;border:2.5px solid var(--ink);border-radius:14px;background:var(--accent);color:#fff;
    box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s;
  }
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn+.btn{margin-top:12px}

  /* 首页 */
  .hero{padding:28px 22px 24px;text-align:center;position:relative;overflow:hidden}
  .stamp{display:inline-block;font-size:12px;font-weight:800;letter-spacing:2px;border:2px solid var(--ink);
    border-radius:99px;padding:4px 12px;background:var(--sp);transform:rotate(-3deg)}
  .hero h1{font-size:44px;line-height:1.1;margin:16px 0 8px;font-weight:900;letter-spacing:1px}
  .hero h1 em{font-style:normal;background:var(--accent);color:#fff;padding:0 8px;border-radius:8px;
    border:2.5px solid var(--ink);display:inline-block;transform:rotate(2deg)}
  .hero p{color:var(--muted);font-size:15px;line-height:1.7}
  .floaters{font-size:26px;letter-spacing:6px;margin:14px 0 4px}
  .floaters span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
  .floaters span:nth-child(2n){animation-delay:.6s}
  .floaters span:nth-child(3n){animation-delay:1.2s}
  @keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
  .name-in{margin:20px 0 16px}
  .name-in label{display:block;font-weight:800;font-size:14px;margin-bottom:8px;text-align:left}
  .name-in input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:2.5px solid var(--ink);
    border-radius:12px;background:#fffdf8;outline:none}
  .name-in input:focus{background:#fff;box-shadow:3px 3px 0 var(--ink)}
  .meta{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:13px;color:var(--muted);font-weight:700}

  /* 答题 */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .back{width:42px;height:42px;flex:none;border:2.5px solid var(--ink);border-radius:12px;background:#fff;
    font-size:18px;font-weight:900;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .back:disabled{opacity:.3;cursor:default}
  .bar{flex:1;height:18px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
  .bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--accent) 0 10px,#ff8a6e 10px 20px);
    transition:width .3s;border-right:2.5px solid var(--ink)}
  .count{font-weight:900;font-size:15px;min-width:48px;text-align:right}
  .qcard{padding:24px 18px 20px}
  .qno{font-size:13px;font-weight:900;color:var(--accent);letter-spacing:1px}
  .qtext{font-size:20px;font-weight:800;line-height:1.5;margin:10px 0 20px}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:15.5px;line-height:1.55;
    padding:13px 13px;border:2.5px solid var(--ink);border-radius:14px;background:#fffdf8;cursor:pointer;color:var(--ink);
    box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s}
  .opt+.opt{margin-top:12px}
  .opt b{flex:none;width:28px;height:28px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;
    font-size:14px;background:var(--sp)}
  .opt:nth-child(2) b{background:var(--sj)}
  .opt:nth-child(3) b{background:var(--nf)}
  .opt:nth-child(4) b{background:var(--pk)}
  .opt:hover{background:#fff}
  .opt.picked{background:var(--ink);color:#fff;transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .opt.picked b{color:var(--ink)}
  .hint{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}

  /* 加载 */
  .loading{padding:48px 20px;text-align:center}
  .spin{font-size:56px;display:inline-block;animation:spin 1s steps(8) infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading ul{list-style:none;margin-top:22px;text-align:left;display:inline-block}
  .loading li{font-size:15px;font-weight:700;margin:10px 0;opacity:0;transition:opacity .3s}
  .loading li.on{opacity:1}

  /* 结果 */
  .rcard{overflow:hidden}
  .rhead{padding:22px 20px 20px;border-bottom:2.5px solid var(--ink);text-align:center;position:relative}
  .rwho{font-size:14px;font-weight:800}
  .remoji{width:210px;max-width:70%;aspect-ratio:1;margin:12px 0 8px;display:inline-block;background:#fff;border:2.5px solid var(--ink);
    border-radius:18px;box-shadow:var(--shadow);object-fit:cover;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
  .rcode{display:inline-block;font-size:15px;font-weight:900;letter-spacing:4px;background:var(--ink);color:#fff;
    padding:3px 12px;border-radius:8px}
  .rname{font-size:38px;font-weight:900;margin:10px 0 6px;letter-spacing:1px}
  .rtag{font-size:16px;font-weight:700}
  .rbody{padding:20px}
  .sec{margin-top:22px}
  .sec:first-child{margin-top:0}
  .sec h3{font-size:14px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .sec h3::before{content:"";width:8px;height:16px;background:var(--accent);border:2px solid var(--ink);border-radius:3px}
  .desc{font-size:15.5px;line-height:1.8}
  .dim{margin:10px 0}
  .dim .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:5px}
  .dim .lbl span.win{color:var(--accent)}
  .dim .track{height:14px;border:2px solid var(--ink);border-radius:99px;background:#f1eadc;overflow:hidden;position:relative}
  .dim .track i{position:absolute;top:0;bottom:0;background:var(--ink);transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fffdf8}
  .stat .k{font-size:13px;font-weight:800;display:flex;justify-content:space-between}
  .stat .k em{font-style:normal;font-weight:900}
  .stat .m{height:8px;border:1.5px solid var(--ink);border-radius:99px;margin-top:7px;overflow:hidden;background:#fff}
  .stat .m i{display:block;height:100%;background:var(--accent);width:0;transition:width 1s .2s}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tags span{border:2px solid var(--ink);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:800;background:var(--sp)}
  .quote{font-size:18px;font-weight:900;padding:14px 16px;border:2.5px dashed var(--ink);border-radius:14px;background:#fffdf8;position:relative}
  .quote::before{content:"💬";position:absolute;top:-14px;left:12px;font-size:20px}
  .rel{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;
    font-size:15px;line-height:1.6;background:#fffdf8}
  .rel+.rel{margin-top:10px}
  .rel strong{flex:none;font-size:13px;padding:2px 8px;border:2px solid var(--ink);border-radius:8px;background:var(--nf)}
  .rel.bad strong{background:var(--pk)}
  .job{font-size:16px;font-weight:800}
  .tip{font-size:15px;line-height:1.7;background:var(--ink);color:#fff;padding:14px 16px;border-radius:14px}
  .actions{margin-top:22px}
  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}

  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,30px);background:var(--ink);color:#fff;font-weight:800;
    padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:30;font-size:14px;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  /* 长图弹窗 */
  .modal{position:fixed;inset:0;background:rgba(26,26,26,.6);display:none;align-items:center;justify-content:center;padding:24px 16px;z-index:20}
  .modal.on{display:flex;animation:up .25s ease}
  .sheet{position:relative;width:100%;max-width:420px;max-height:100%;display:flex;flex-direction:column;background:var(--bg);
    border:2.5px solid var(--ink);border-radius:18px;box-shadow:var(--shadow);padding:16px}
  .pv{flex:1;min-height:0;overflow:auto;border:2px solid var(--ink);border-radius:12px;background:#fff}
  .pv img{display:block;width:100%}
  .phint{font-size:12px;color:var(--muted);text-align:center;margin:10px 0}
  .row{display:flex;gap:10px}
  .row .btn{margin:0;font-size:15px;padding:12px}
  .link{display:block;margin:10px auto 0;background:none;border:0;font:inherit;font-size:13px;font-weight:700;
    text-decoration:underline;color:var(--muted);cursor:pointer}
  .x{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);
    background:#fff;color:var(--ink);font-size:16px;font-weight:900;cursor:pointer}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:25;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app">

  <!-- 首页 -->
  <section id="home" class="screen active">
    <div class="box hero">
      <span class="stamp">⚠ 仅供摸鱼使用</span>
      <h1>打工人<br><em>MBTI</em></h1>
      <div class="floaters"><span>☕</span><span>💻</span><span>📊</span><span>🐟</span><span>🔥</span></div>
      <p>20 道灵魂拷问，测出你在公司的真实形态<br>答案只有你知道，结果只有你敢发</p>
      <div class="name-in">
        <label for="name">你的花名（可不填）</label>
        <input id="name" maxlength="12" placeholder="比如：工位第三排的小王" autocomplete="off">
      </div>
      <button class="btn" onclick="start()">开始上班 →</button>
      <div class="meta"><span>📝 80 题随机抽 20</span><span>⏱ 约 3 分钟</span><span>🎭 结果保密</span></div>
    </div>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="screen">
    <div class="topbar">
      <button class="back" id="backBtn" onclick="back()" aria-label="上一题">←</button>
      <div class="bar"><i id="barFill" style="width:0"></i></div>
      <div class="count" id="count">1/20</div>
    </div>
    <div class="box qcard">
      <div class="qno" id="qno">第 1 题</div>
      <div class="qtext" id="qtext"></div>
      <div id="opts"></div>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <!-- 加载 -->
  <section id="loading" class="screen">
    <div class="box loading">
      <div class="spin">🌀</div>
      <ul id="loadList">
        <li>📂 正在调取你的摸鱼监控录像…</li>
        <li>📝 正在鉴定你的周报含水量…</li>
        <li>🫓 正在测量你的画饼半径…</li>
        <li>🧬 正在生成你的打工人格…</li>
      </ul>
    </div>
  </section>

  <!-- 结果 -->
  <section id="result" class="screen">
    <div class="box rcard">
      <div class="rhead" id="rhead">
        <div class="rwho" id="rwho"></div>
        <img class="remoji" id="remoji" alt=""><br>
        <span class="rcode" id="rcode"></span>
        <div class="rname" id="rname"></div>
        <div class="rtag" id="rtag"></div>
      </div>
      <div class="rbody">
        <div class="sec"><h3>你的打工成分</h3><div id="dims"></div></div>
        <div class="sec"><h3>人格画像</h3><p class="desc" id="rdesc"></p></div>
        <div class="sec"><h3>打工属性面板</h3><div class="stats" id="stats"></div></div>
        <div class="sec"><h3>职场技能</h3><div class="tags" id="skills"></div></div>
        <div class="sec"><h3>口头禅</h3><div class="quote" id="rquote"></div></div>
        <div class="sec"><h3>天选岗位</h3><div class="job" id="rjob"></div></div>
        <div class="sec"><h3>职场关系</h3><div id="pair"></div></div>
        <div class="sec"><h3>生存指南</h3><div class="tip" id="rtip"></div></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="openPoster()">🖼 生成长图，发到群里</button>
      <button class="btn ghost" onclick="show('home')">🔁 换个人再测</button>
    </div>
    <p class="foot">纯属娱乐，如有雷同，那你就是本人 🐟</p>
  </section>
</div>
<div class="modal" id="poster" onclick="if (event.target === this) closePoster()">
  <div class="sheet">
    <div class="pv"><img id="posterImg" alt="打工人格长图"></div>
    <p class="phint">手机上长按图片，也能直接保存或转发</p>
    <div class="row">
      <button class="btn" onclick="copyPoster()">📋 复制图片</button>
      <button class="btn ghost" onclick="savePoster()">💾 保存图片</button>
    </div>
    <button class="link" onclick="copyResult()">只复制文字版</button>
    <button class="x" onclick="closePoster()" aria-label="关闭">✕</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- 四个维度 ----------
const DIMS = [
  {a:'E', b:'I', an:'社牛', bn:'社恐'},
  {a:'S', b:'N', an:'务实派', bn:'画饼派'},
  {a:'T', b:'F', an:'理性派', bn:'和事佬'},
  {a:'J', b:'P', an:'计划狂', bn:'死线战士'},
];

// ---------- 80 道题库：每个维度 20 道，每次各抽 5 道 ----------
// 每题 4 个选项：两个偏向一边，两个偏向另一边；权重 2 = 程度更极端
const BANK = [
  {q:'周一早会，领导问："大家还有什么想法？"', o:[
    ['举手："我先抛砖引玉！"——然后讲了二十分钟','E',2],
    ['等第一个人说完，接一句"我非常同意，另外……"','E',1],
    ['疯狂点头，用眼神表达"我有想法但我不说"','I',1],
    ['摄像头早关了，人在被窝里，靠意念参会','I',2]]},
  {q:'领导说："这个需求很简单，你看一下。"', o:[
    ['立刻反问：哪个页面？几个字段？哪天要？','S',2],
    ['先去翻三个竞品，看看别人怎么做的','S',1],
    ['已经想到它能延伸出一条新业务线','N',1],
    ['脑中浮现自己凭这个需求登上财经杂志封面','N',2]]},
  {q:'同事的方案明显有个大坑，你会？', o:[
    ['"逻辑不通，数据不支持，建议重做。"','T',2],
    ['"第三页的假设，可能需要再验证一下。"','T',1],
    ['"整体超棒！有个小地方我们可以再一起看看～"','F',1],
    ['不忍心说，晚上偷偷帮他改好了','F',2]]},
  {q:'周五下午五点，你的下周计划是？', o:[
    ['已排进日历，精确到半小时，连上厕所都留了档期','J',2],
    ['列好了下周的三件大事','J',1],
    ['大概知道下周有点事，具体看情况','P',1],
    ['下周的事，交给下周的我（他也不会处理的）','P',2]]},
  {q:'部门团建去 KTV，你在干嘛？', o:[
    ['开场就点《死了都要爱》，麦克风焊在手上','E',2],
    ['不抢麦，但负责全场合唱、摇铃和喊"安可"','E',1],
    ['坐角落切水果，被点名才唱一首《小幸运》','I',1],
    ['提前想好三个借口，最后用了第四个："猫病了"','I',2]]},
  {q:'写周报时，你的风格是？', o:[
    ['完成 12 项工作，附截图、数据和工时明细表','S',2],
    ['老老实实写做了啥，有点像流水账但很真诚','S',1],
    ['"持续深耕核心抓手，打通业务闭环。"','N',1],
    ['"本周在认知层面完成了一次底层逻辑的跃迁。"','N',2]]},
  {q:'同事在工位上偷偷抹眼泪，你会？', o:[
    ['递纸巾："是哪个环节出了问题？我帮你复盘。"','T',2],
    ['不多问，默默把他手上的活分走一点','T',1],
    ['拉他去楼下奶茶店，先陪着骂一小时','F',1],
    ['他还没开口，你已经哭得比他还凶','F',2]]},
  {q:'一个任务的截止日期在两周后，你会？', o:[
    ['当天拆成 14 个子任务，还画了甘特图','J',2],
    ['先做掉一半，剩下的匀速推进','J',1],
    ['先酝酿一下，等灵感来了再说','P',1],
    ['前 13 天毫无动静，最后一晚化身战神','P',2]]},
  {q:'电梯里只有你和一个不太熟的同事', o:[
    ['三十秒内问出了他的老家、星座和房贷利率','E',2],
    ['"今天天气不错哈。"——成功撑到出电梯','E',1],
    ['死死盯着楼层数字，仿佛在看一部悬疑片','I',1],
    ['电梯门一开看到他，假装忘带东西，改走楼梯','I',2]]},
  {q:'新同事问你某个系统怎么用', o:[
    ['发了三十张截图，每张都有红框、箭头和编号','S',2],
    ['"你点这儿，再点这儿，好了。"','S',1],
    ['先讲讲这个系统为什么要这么设计','N',1],
    ['从公司的数字化转型历程开始讲起','N',2]]},
  {q:'年底同事互评，你会？', o:[
    ['打开 Excel 按产出逐条打分，精确到小数点后一位','T',2],
    ['按事实打分，但措辞客气一点','T',1],
    ['大家都不容易，统统好评','F',1],
    ['给每个人写了 300 字小作文，还配了表情包','F',2]]},
  {q:'打开你的电脑桌面，上面是？', o:[
    ['只有一个文件夹，名字叫"桌面"','J',2],
    ['分好了类，偶尔有几条漏网之鱼','J',1],
    ['铺满了文件，但我知道每个在哪','P',1],
    ['最终版、最终版2、真的最终版、打死不改版.pptx','P',2]]},
  {q:'工作群里有人发了个梗', o:[
    ['秒接梗，顺手发起一轮表情包大战','E',2],
    ['回一个"哈哈哈哈哈哈"，长度代表诚意','E',1],
    ['在屏幕前笑出声，表面上已读不回','I',1],
    ['群消息免打扰，三天后才看到','I',2]]},
  {q:'开完会，你的笔记本上写着？', o:[
    ['待办、负责人、截止日期，还用了三种颜色','S',2],
    ['几条关键信息，够用就行','S',1],
    ['一堆箭头和圆圈，像一张神秘藏宝图','N',1],

const STAT_NAMES = ['摸鱼指数','内卷指数','社交电量','画饼能力'];
const COLOR = {NT:'var(--nt)', NF:'var(--nf)', SJ:'var(--sj)', SP:'var(--sp)'};
const colorOf = c => c[1] === 'N' ? COLOR['N' + c[2]] : COLOR['S' + c[3]];

// ---------- 状态 ----------
let idx = 0, answers = [], order = [], userName = '', lastResult = null, locked = false;
const $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function start(){
  userName = $('name').value.trim();
  idx = 0; answers = [];
  drawQuestions();
  order = QS.map(() => shuffle([0,1,2,3])); // 每题选项随机排列，避免规律
  show('quiz'); renderQ();
}

function renderQ(){
  const q = QS[idx];
  $('qno').textContent = `第 ${idx+1} 题`;
  $('qtext').textContent = q.q;
  $('count').textContent = `${idx+1}/${QS.length}`;
  $('barFill').style.width = (idx / QS.length * 100) + '%';
  $('backBtn').disabled = idx === 0;
  $('hint').textContent = HINTS[Math.floor(idx / 4)];
  $('opts').innerHTML = '';
  order[idx].forEach((oi, k) => {
    const b = document.createElement('button');
    b.className = 'opt' + (answers[idx] === oi ? ' picked' : '');
    b.innerHTML = `<b>${'ABCD'[k]}</b><span>${q.o[oi][0]}</span>`;
    b.onclick = () => pick(b, oi);
    $('opts').appendChild(b);
  });
  const card = document.querySelector('.qcard');
  card.style.animation = 'none'; card.offsetHeight; card.style.animation = 'up .3s ease';
}

function pick(btn, oi){
  if (locked) return;
  locked = true;
  document.querySelectorAll('.opt').forEach(o => o.classList.remove('picked'));
  btn.classList.add('picked');
  answers[idx] = oi;
  setTimeout(() => {
    locked = false;
    if (idx < QS.length - 1){ idx++; renderQ(); }
    else finish();
  }, 260);
}

function back(){ if (idx > 0){ idx--; renderQ(); } }

function score(){
  const sc = {}, last = {};
  answers.forEach((oi, i) => {
    const [, v, w] = QS[i].o[oi];
    sc[v] = (sc[v] || 0) + w;
    DIMS.forEach(d => { if (v === d.a || v === d.b) last[d.a] = v; });
  });
  // 平分时，以该维度最后一题的选择为准
  const code = DIMS.map(d => {
    const a = sc[d.a] || 0, b = sc[d.b] || 0;
    return a > b ? d.a : b > a ? d.b : last[d.a];
  }).join('');
  const pct = DIMS.map(d => {
    const a = sc[d.a] || 0, b = sc[d.b] || 0;
    return Math.round(a / (a + b) * 100);
  });
  return {code, pct};
}

function finish(){
  $('barFill').style.width = '100%';
  show('loading');
  const lis = [...$('loadList').children];
  lis.forEach(l => l.classList.remove('on'));
  lis.forEach((l, i) => setTimeout(() => l.classList.add('on'), 350 + i * 420));
  setTimeout(() => {
    lastResult = score();
    renderResult(lastResult.code, lastResult.pct, userName);
    confetti(T[lastResult.code].e);
  }, 2300);
}

function renderResult(code, pct, who){
  const t = T[code];
  $('rhead').style.background = colorOf(code);
  $('rwho').textContent = `${who || '你'}的打工人格是`;
  $('remoji').src = 'img/' + code + '.jpg';
  $('remoji').alt = t.n;
  $('remoji').style.animation = 'none'; $('remoji').offsetHeight; $('remoji').style.animation = '';
  $('rcode').textContent = code;
  $('rname').textContent = t.n;
  $('rtag').textContent = '「' + t.t + '」';
  $('rdesc').textContent = t.d;
  $('rquote').textContent = t.q;
  $('rjob').textContent = '💼 ' + t.j;
  $('rtip').textContent = '💡 ' + t.tip;
  $('skills').innerHTML = t.s.map(s => `<span>${s}</span>`).join('');
  $('pair').innerHTML = `<div class="rel"><strong>🤝 最佳搭档</strong><span>${t.b}</span></div>
    <div class="rel bad"><strong>⚡ 职场天敌</strong><span>${t.x}</span></div>`;

  // 平分时百分比是 50/50，以人格字母为准高亮
  $('dims').innerHTML = DIMS.map((d, i) => {
    const left = pct[i], win = code[i] === d.a;
    return `<div class="dim"><div class="lbl">
      <span class="${win?'win':''}">${d.a} ${d.an} ${left}%</span>
      <span class="${win?'':'win'}">${100-left}% ${d.bn} ${d.b}</span></div>
      <div class="track"><i style="${win?'left:0':'right:0'};width:0" data-w="${win?left:100-left}"></i></div></div>`;
  }).join('');
  $('stats').innerHTML = t.st.map((v, i) =>
    `<div class="stat"><div class="k">${STAT_NAMES[i]}<em>${v}</em></div><div class="m"><i data-w="${v}"></i></div></div>`).join('');

  show('result');
  setTimeout(() => {
    document.querySelectorAll('#result [data-w]').forEach(el => el.style.width = el.dataset.w + '%');
  }, 80);
}

function copyResult(){
  const t = T[lastResult.code];
  const text = `我测出来的打工人格是【${lastResult.code} ${t.n} ${t.e}】\n「${t.t}」\n口头禅：${t.q}\n职场天敌：${t.x}\n\n你是哪种打工人？找我要「打工人MBTI」来测测 👀`;
  const done = () => toast('已复制！快去群里炫耀 🎉');
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败，截图分享也行 📸'); }
  ta.remove();
}

// ---------- 结果长图 ----------
const HEX = {NT:'#c3b1ff', NF:'#8fe3b3', SJ:'#9fd0ff', SP:'#ffd36e'};
const SITE = 'https://zhihao-r.github.io/dagong-mbti/';
const FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const PW = 750, FOOT = 250; // 长图逻辑宽度；底部二维码区高度
let posterBlob = null;

const shareUrl = () => location.protocol.startsWith('http') ? location.origin + location.pathname : SITE;
function rr(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function wrap(c, text, maxW){
  const lines = []; let line = '';
  for (const ch of text){
    if (line && c.measureText(line + ch).width > maxW){ lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}

// 画一遍返回总高度；H 为 0 时只用来量高度
function drawPoster(c, H, pic, qr){
  const {code, pct} = lastResult, t = T[code];
  const grp = code[1] === 'N' ? 'N' + code[2] : 'S' + code[3];
  const CX = 32, CW = PW - 64, X = CX + 40, IW = CW - 80, TOP = 40, HH = 640;
  const ink = '#1a1a1a', red = '#ff6b4a', f = (w, s) => c.font = `${w} ${s}px ${FONT}`;
  const cardH = (H || 4000) - FOOT - TOP;

  // 背景 + 卡片
  c.fillStyle = '#fff6e5'; c.fillRect(0, 0, PW, H || 4000);
  c.fillStyle = '#e9dcc3';
  for (let i = 9; i < PW; i += 18) for (let j = 9; j < H; j += 18){ c.beginPath(); c.arc(i, j, 1.3, 0, 7); c.fill(); }
  c.fillStyle = ink; rr(c, CX + 6, TOP + 6, CW, cardH, 26); c.fill();
  c.save(); rr(c, CX, TOP, CW, cardH, 26); c.clip();
  c.fillStyle = '#fff'; c.fillRect(CX, TOP, CW, cardH);
  c.fillStyle = HEX[grp]; c.fillRect(CX, TOP, CW, HH);
  c.fillStyle = ink; c.fillRect(CX, TOP + HH, CW, 3);
  c.restore();

  // 头部：插画、人格代码、名字
  c.textAlign = 'center'; c.fillStyle = ink;
  f(800, 26); c.fillText(`${userName || '你'}的打工人格是`, PW / 2, TOP + 64);
  const P = 300, px = PW / 2 - P / 2, py = TOP + 96;
  c.fillStyle = ink; rr(c, px + 5, py + 5, P, P, 22); c.fill();
  c.save(); rr(c, px, py, P, P, 22); c.clip();
  c.fillStyle = '#fff'; c.fillRect(px, py, P, P); c.drawImage(pic, px, py, P, P);
  c.restore();
  c.lineWidth = 4; c.strokeStyle = ink; rr(c, px, py, P, P, 22); c.stroke();
  const spaced = code.split('').join(' '), cy = py + P + 28;
  f(900, 28); const pw = c.measureText(spaced).width + 44;
  rr(c, PW / 2 - pw / 2, cy, pw, 48, 12); c.fill();
  c.fillStyle = '#fff'; c.fillText(spaced, PW / 2, cy + 34);
  c.fillStyle = ink; f(900, 68); c.fillText(t.n, PW / 2, cy + 130);
  f(700, 28); c.fillText('「' + t.t + '」', PW / 2, cy + 182);

  // 正文
  c.textAlign = 'left';
  let y = TOP + HH + 56;
  const sec = title => {
    c.fillStyle = red; rr(c, X, y - 24, 14, 28, 4); c.fill();
    c.lineWidth = 3; c.strokeStyle = ink; c.stroke();
    c.fillStyle = ink; f(900, 28); c.fillText(title, X + 26, y);
    y += 30;
  };

  sec('你的打工成分');
  DIMS.forEach((d, i) => {
    const l = pct[i], win = code[i] === d.a, w = IW * (win ? l : 100 - l) / 100, ty = y + 42;
    f(800, 24);
    c.fillStyle = win ? red : ink; c.fillText(`${d.a} ${d.an} ${l}%`, X, y + 28);
    c.textAlign = 'right'; c.fillStyle = win ? ink : red; c.fillText(`${100 - l}% ${d.bn} ${d.b}`, X + IW, y + 28);
    c.textAlign = 'left';
    c.save(); rr(c, X, ty, IW, 22, 11); c.clip();
    c.fillStyle = '#f1eadc'; c.fillRect(X, ty, IW, 22);
    c.fillStyle = ink; c.fillRect(win ? X : X + IW - w, ty, w, 22);
    c.restore();
    c.lineWidth = 3; c.strokeStyle = ink; rr(c, X, ty, IW, 22, 11); c.stroke();
    y += 84;
  });

  y += 30; sec('口头禅'); y += 14;
  f(900, 30); const ql = wrap(c, t.q, IW - 48), qh = ql.length * 44 + 36;
  c.fillStyle = '#fffdf8'; rr(c, X, y, IW, qh, 18); c.fill();
  c.setLineDash([10, 8]); c.lineWidth = 3; c.strokeStyle = ink; c.stroke(); c.setLineDash([]);
  c.fillStyle = ink; ql.forEach((s, i) => c.fillText(s, X + 24, y + 50 + i * 44));
  y += qh + 56;

  sec('职场关系'); y += 14;
  [['🤝 最佳搭档', t.b, '#8fe3b3'], ['⚡ 职场天敌', t.x, '#ffb3c7']].forEach(([k, v, col]) => {
    f(900, 22); const kw = c.measureText(k).width + 24;
    f(700, 26); const tl = wrap(c, v, IW - kw - 54), h = tl.length * 38 + 36;
    c.fillStyle = '#fffdf8'; rr(c, X, y, IW, h, 16); c.fill();
    c.lineWidth = 3; c.strokeStyle = ink; c.stroke();
    c.fillStyle = col; rr(c, X + 18, y + 16, kw, 38, 10); c.fill(); c.stroke();
    c.fillStyle = ink; f(900, 22); c.fillText(k, X + 30, y + 43);
    f(700, 26); tl.forEach((s, i) => c.fillText(s, X + kw + 36, y + 45 + i * 38));
    y += h + 16;
  });

  y += 40; sec('生存指南'); y += 14;
  f(700, 26); const tp = wrap(c, '💡 ' + t.tip, IW - 48), th = tp.length * 40 + 40;
  c.fillStyle = ink; rr(c, X, y, IW, th, 18); c.fill();
  c.fillStyle = '#fff'; tp.forEach((s, i) => c.fillText(s, X + 24, y + 48 + i * 40));
  y += th + 44;

  c.lineWidth = 5; c.strokeStyle = ink; rr(c, CX, TOP, CW, y - TOP, 26); c.stroke();

  // 底部：二维码 + 邀请语
  const fy = y + 40;
  if (qr){
    const Q = 160, qx = CX + CW - Q, n = qr.getModuleCount(), m = (Q - 24) / n;
    c.fillStyle = '#fff'; rr(c, qx, fy, Q, Q, 14); c.fill(); c.lineWidth = 3; c.stroke();
    c.fillStyle = ink;
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++)
      if (qr.isDark(r, k)) c.fillRect(qx + 12 + k * m, fy + 12 + r * m, m + .5, m + .5);
  }
  c.fillStyle = ink; f(900, 34); c.fillText('你是哪种打工人？', CX + 4, fy + 52);
  f(700, 24); c.fillText(qr ? '扫码测测你在工位上的真实形态 👀' : '找我要「打工人MBTI」来测测 👀', CX + 4, fy + 98);
  c.fillStyle = '#6b6257'; f(600, 20); c.fillText('纯属娱乐，如有雷同，那你就是本人 🐟', CX + 4, fy + 138);
  return y + FOOT;
}

// 本地 file:// 打开时，直接画 img/ 里的图会被浏览器拦截导出，改用内嵌数据
function localPic(code){
  const load = () => new Promise((ok, no) => {
    const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = window.IMG_DATA[code];
  });
  if (window.IMG_DATA) return load();
  return new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = 'img/data.js'; sc.onload = () => load().then(ok, no); sc.onerror = no;
    document.head.appendChild(sc);
  });
}

async function openPoster(){
  if (!lastResult) return;
  try {
    const pic = location.protocol === 'file:' ? await localPic(lastResult.code) : $('remoji');
    await pic.decode().catch(() => {});
    let qr = null;
    if (window.qrcode){ qr = qrcode(0, 'M'); qr.addData(shareUrl()); qr.make(); }
    const H = drawPoster(document.createElement('canvas').getContext('2d'), 0, pic, qr);
    const cv = document.createElement('canvas'), S = 2;
    cv.width = PW * S; cv.height = H * S;
    const c = cv.getContext('2d'); c.scale(S, S);
    drawPoster(c, H, pic, qr);
    posterBlob = await new Promise((ok, no) => cv.toBlob(b => b ? ok(b) : no(), 'image/png'));
    const img = $('posterImg');
    if (img.src) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(posterBlob);
    $('poster').classList.add('on'); document.body.style.overflow = 'hidden';
  } catch(e){
    console.error(e);
    toast('长图生成失败，刷新页面再试一次 🙏');
  }
}
function closePoster(){ $('poster').classList.remove('on'); document.body.style.overflow = ''; }
async function copyPoster(){
  try {
    await navigator.clipboard.write([new ClipboardItem({'image/png': posterBlob})]);
    toast('图片已复制，去群里粘贴吧 🎉');
  } catch(e){ toast('这个浏览器不支持复制图片，长按图片保存吧 📸'); }
}
function savePoster(){
  const a = document.createElement('a');
  a.href = $('posterImg').src; a.download = `打工人MBTI-${lastResult.code}.png`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('已保存，去相册/下载里找找 📥');
}

function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2000);
}

function confetti(emoji){
  const pool = [emoji, '🎉', '✨', '🐟', '☕', emoji];
  for (let i = 0; i < 28; i++){
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = pool[i % pool.length];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (2 + Math.random() * 2) + 's';
    s.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5000);
  }
}

$('name').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
